name: Code Quality

on:
  pull_request:
    paths:
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "scripts/**"
      - "*.json"
      - "*.ts"
      - "*.mjs"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "scripts/**"
      - "*.json"
      - "*.ts"
      - "*.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:encoding
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:workflow
